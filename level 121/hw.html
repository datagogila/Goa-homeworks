<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 1
        let promise1 = new Promise((resolve, reject) => {
            resolve("Hello");
        });
        promise1.then(result => {
            console.log(result);
        });

        // 2
        let promise2 = new Promise((resolve, reject) => {
            reject("Error");
        });

        promise2.catch(error => {
            console.log(error);
        });

        // 3   
        let promise3 = new Promise((resolve, reject) => {
            resolve(5);
        });

        promise3
            .then(num => {
                return num * 2;
            })
            .then(result => {
                console.log(result);
            });

        // 4
        let promise4 = new Promise((resolve, reject) => {
            resolve("Start");
        });

        promise4
            .then(text => {
                return text + " -> End";
            })
            .then(result => {
                console.log(result);
            });


        // 5
        let promise5 = new Promise((resolve, reject) => {
            let random = Math.random();

            if (random > 0.5) {
                resolve("Success");
            } else {
                reject("Fail");
            }
        });

        promise5
            .then(result => {
                console.log(result);
            })
            .catch(error => {
                console.log(error);
            });
    </script>
</body>

</html>
