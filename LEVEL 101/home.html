    <script>
        //1
       let names = ["ana", "andria", "anastasia", "giorgi", "axtona", "nika", "anamaria", "dato"];

let result1 = names.filter(function(name){
    return name[0] == "a" 
});
console.log(result1);

//2
let yiyliyo = ["ana", 2, "gio", 7, "dato", 8, "nika", 5, "luka"];

let result2 = yiyliyo.filter(function(element, index){

    if (index % 2 === 0){
        return true;
    }

    if (element % 2 === 0){
        return true;
    }

    return false;
});
console.log(result2);

//3
let numbers = [10, 20, 30, 40, 50, 60];

let result = numbers.filter(function(element, index){
    return index % 2 == 0;
});

console.log(result);

//4
