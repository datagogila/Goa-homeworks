<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown until ends 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>2025 Ends in</h1>

        <div class="timer">
            <div class="box">
                <span id="day">00</span>
                <p>Days</p>
            </div>
            <div class="box">
                <span id="hr">00</span>
                <p>Hours</p>
            </div>
            <div class="box">
                <span id="min">00</span>
                <p>Minutes</p>
            </div>
            <div class="box">
                <span id="sec">00</span>
                <p>Seconds</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
