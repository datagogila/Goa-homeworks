<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 1

        setTimeout(() => {
            console.log("A");
        }, 3000);
        setTimeout(() => {
            console.log("B");
        }, 1000);
        setTimeout(() => {
            console.log("C");
        }, 2000);

        // 2
        const promise1 = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Hello");
            }, 2000);
        });

        promise1
            .then(result => {
                return result + " World";
            })
            .then(finalResult => {
                console.log(finalResult);
            });



        // 3
        const eatPromise = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Eat");
            }, 2000);
        });

        const sleepPromise = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Sleep");
            }, 1000);
        });

        eatPromise
            .then(result => {
                console.log(result);

                return sleepPromise;
            })
            .then(result => {
                console.log(result);
            });

        // 4
        const task1 = new Promise((resolve) => {
            setTimeout(() => {
                resolve("Task 1");
            }, 3000);
        });
        const task2 = new Promise((resolve) => {
            setTimeout(() => {
                resolve("Task 2");
            }, 2000);
        })
        const task3 = new Promise((resolve) => {
            setTimeout(() => {
                resolve("Task 3");
            }, 1000);
        });

        Promise.race([task1, task2, task3])
            .then(result => {
                console.log(result);
            });

        // 5

        const randomPromise = new Promise((resolve, reject) => {
            let random = Math.random();

            if (random < 0.5) {
                resolve("Success");
            } else {
                reject("Error");
            }
        });

        randomPromise
            .then(result => {
                console.log(result);
            })
            .catch(error => {
                console.log(error);
            });
    </script>
</body>

</html>
