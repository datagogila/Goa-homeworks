<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="searchInput" placeholder="Enter product title">
    <button id="btn">Search</button>

    <div id="container"></div>

    <script>
        const createNewCard = (product) => {
    let parentDiv = document.createElement("div")
    parentDiv.style.width = "300px"
    parentDiv.style.hieght = "400px"
    parentDiv.style.border = "1px solid black"
    parentDiv.style.padding = "15px"
    parentDiv.style.display = "flex"
    parentDiv.style.flexDirection = "column"
    parentDiv.style.alignItems = "center"
    parentDiv.style.gap = "10px"
    parentDiv.id = product.id

    let productImage = document.createElement("img")
    productImage.src = product.images[0]
    productImage.style.width = "200px"

    let productTitle = document.createElement("h1")
    productTitle.textContent = product.title

    let productDescription = document.createElement("p")
    productDescription.textContent = product.description

    let productPrice = document.createElement("h2")

    productPrice.textContent = product.price


    parentDiv.append(productImage, productTitle, productDescription, productPrice)

    return parentDiv
}

let fetchApi = fetch('https://api.escuelajs.co/api/v1/products/')

let Response = fetchApi.then(response => response.json())

Response.then(data => {
    data.map(item => {
        let productElement = createNewCard(item)
        document.body.appendChild(productElement)
    })
})
    </script>
</body>

</html>
