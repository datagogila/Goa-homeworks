<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calculator</title>
  <link rel="stylesheet" href="class.css" />
</head>
<body>




  <div class="buttons">
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button class="❤️">❤️</button>

    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button class="op">+</button>

    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button class="op">-</button>

    <button>.</button>
    <button>0</button>
    <button class="op">/</button>
    <button class="op">x</button>

    <button class="reset">RESET</button>
    <button class="equal">=</button>
  </div>
</div>

<script src="class.js"></script>
</body>
</html>
