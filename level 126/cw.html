<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //1
        function comp(array1, array2) {
            if (!array1 || !array2) {
                return false;
            }

            let arr1 = array1.map(num => num * num).sort((a, b) => a - b);
            let arr2 = array2.sort((a, b) => a - b);

            for (let i = 0; i < arr1.length; i++) {
                if (arr1[i] !== arr2[i]) {
                    return false;
                }
            }

            return true;
        }

        //2
        function f(arr) {
            return arr.filter(item => item !== 0);
        }
    </script>
</body>

</html>
