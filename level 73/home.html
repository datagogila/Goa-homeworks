    <script>
        let fruits = ["apple", "banana", "orange"];

console.log("საწყისი სია:", fruits);

// push
fruits.push("kiwi");
console.log("push:", fruits);

// pop
fruits.pop();
console.log("pop:", fruits);

// unshift
fruits.unshift("mango");
console.log("unshift:", fruits);

// shift
fruits.shift();
console.log("shift:", fruits);

// concat
let moreFruits = ["pear", "grape"];
let allFruits = fruits.concat(moreFruits);
console.log("concat:", allFruits);

// splice
allFruits.splice(2, 1); 
console.log("splice:", allFruits);

// slice
let sliced = allFruits.slice(1, 3);
console.log("slice:", sliced);

// join
let fruitString = allFruits.join(", ");
console.log("join:", fruitString);

// reverse
allFruits.reverse();
console.log("reverse:", allFruits);

// sort
allFruits.sort();
console.log("sort:", allFruits);
