<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: cursive;
            height: 100vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            padding: 10px;
            align-items: center;
            background-color: rgb(206, 206, 206);
            border-bottom: 2px solid;

        }

        main img {
            width: 100px;
            height: 120px;
        }

        main {
            padding: 25px 15px 0 30px;
            transition: 1s;
        }

        .card {
            width: 300px;
            height: 300px;
            background-color: rgb(206, 206, 206);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .btn {
            border: none;
            border-radius: 8px;
            background-color: black;
            color: white;
            width: 100px;
            height: 30px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.5s;
            border: 1px solid black;
        }

        .btn:hover {
            background-color: grey;
            transform: scale(1.1);
        }

        .row {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            padding-top: 10px;
            gap: 20px;
        }

        #abts:hover {
            background-color: rgb(0, 255, 0);
            transition: 1s linear;
            font-size: 20px;
        }

        #abts {
            border-radius: 8px;
            transition: 1s;
        }

        @keyframes animacia {
            0% {
                transform: translate(0px, -100px);
            }

            100% {
                transform: translate(0px, 0px);
            }
        }

        #shopping {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            background-color: rgb(189, 188, 188);
            border: 2px solid black;
            padding: 10px;
            transform: translateX(270px);
            transition: 1s;
            overflow-y: scroll;
        }

        img {
            max-width: 100px;
            max-height: 100px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>PC SHOP</h1>
        <p id="abts">About US</p>
    </div>

    <main>
        <div class="row">
            <div class="card">
                <p><b>iPhone 8</b> <br> <span>200$</span></p>
                <button class="btn">Add To Cart</button>
            </div>
            <div class="card">
                <p><b>iPhone 9</b> <br> <span>250$</span></p>
                <button class="btn">Add To Cart</button>
            </div>
            <div class="card">
                <p><b>iPhone X</b> <br> <span>300$</span></p>
                <button class="btn">Add To Cart</button>
            </div>
        </div>

        <div class="row">
            <div class="card">
                <p><b>iPhone 11</b> <br> <span>320$</span></p>
                <button class="btn">Add To Cart</button>
            </div>
            <div class="card">
                <p><b>iPhone 12</b> <br> <span>380$</span></p>
                <button class="btn">Add To Cart</button>
            </div>
            <div class="card">
                <p><b>iPhone 13 mini</b> <br> <span>400$</span></p>
                <button class="btn">Add To Cart</button>
            </div>
        </div>
    </main>

    <div id="shopping">
        <h1>Shopping Cart</h1>
        <p>Items: <span id="Amount">0</span></p>
        <p>Total: <span id="Total">0</span>$</p>
        <div id="add"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
