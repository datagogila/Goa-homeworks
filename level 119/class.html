    <script>
        //1
        function manqanebi(brand, model, color) {
            this.brand = brand;
            this.model = model;
            this.color = color;
        }
        let car1 = new manqanebi("bmw", "m4", "White");
        let car2 = new manqanebi("Mercedes", "cls63", "Black");

        console.log(car1, car2);

        //2
        function studenti(name, age, grade) {
            this.name = name;
            this.age = age;
            this.grade = grade;
        }
        let student1 = new studenti("data", 12, "6");
        let student2 = new studenti("luka", 11, "5");
        let student3 = new studenti("gio", 10, "5");

        console.log(student1, student2, student3);

        }

        const phone2 = new telefoni("samsung", 900, "256gb");
