<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family:cursive;
}

body {
    background: #3691e0;
background: linear-gradient(90deg, rgba(54, 145, 224, 1) 0%, rgba(23, 32, 65, 1) 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0 15px 0;
    font-size: 13px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 5px;
}

.forgot {
    color: #ff4d4f;
    text-decoration: none;
}


#form {
    background: #ffffff;
    padding: 25px;
    width: 320px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

#form label {
    font-size: 14px;
    color: #333;
}

#form input {
    width: 100%;
    padding: 10px;
    margin: 8px 0 5px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
}

#form input:focus {
    border-color: #1e6ee6;
}

#form p {
    margin-bottom: 10px;
}

#form button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background-color: #1e6ee6;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

#form button:hover {
    background-color: #1559c9;
}

    </style>
</head>
<body>
    <form id="form">
        <label for="email">email</label><br>
        <input type="email" placeholder=" enter your email" id="email"><br>
      

        <label for="password">password</label><br>
        <input type="password" placeholder="enter your password" id="password"><br>


        <div class="options">
            <label class="remember">
                <input type="checkbox">
                Remember Me
            </label>
            <a href="#" class="forgot">Forgot Password?</a>
        </div>
        

        <button type="submit">Submit</button>
    </form>

</body>
</html>
