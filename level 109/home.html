<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = Number(prompt("შეიყვანე მთელი რიცხვი "));
        let sum = 0;

        for (let i = 1; i <= n; i++) {
            sum += i;
        }

        console.log(sum);

        let password = "1234";
        let userInput = "";

        while (userInput !== password) {
            userInput = prompt("შეიყვანე პაროლი:");

            if (userInput !== password) {
                console.log("პაროლი არასწორია, სცადე თავიდან.");
            }
        }

        console.log("პაროლი სწორია");

        for (let i = 2; i <= 50; i += 2) {
            console.log(i);
        }
        
    </script>
</body>

</html>
