    <script>
        function accum(s) {
  let result = "";
  
  for (let i = 0; i < s.length; i++) {
    let part = s[i].toUpperCase(); 
    for (let j = 0; j < i; j++) { 
      part += s[i].toLowerCase();
    }

    if (i < s.length - 1) {
      result += part + "-";
    } else {
      result += part;
    }
  }
  
  return result;
}
    </script>

function validatePIN(pin) {
  if (/^\d+$/.test(pin)) { 
    if (pin.length === 4 , pin.length === 6) { 
      return true;
    } else {
      return false;
    }
  } else {
    return false;

}

    <script>
function isAnagram(str1, str2) {
 
  str1 = str1.toLowerCase();
  str2 = str2.toLowerCase();

  const sorted1 = str1.split('').sort().join('');
  const sorted2 = str2.split('').sort().join('');

  return sorted1 === sorted2;
}

    <script>
        function nbDig(n, d) {
  let count = 0;
  const digit = d.toString(); 

  for (let k = 0; k <= n; k++) {

    const square = (k * k).toString(); 

    for (let char of square) {
      if (char === digit) {
        count++;
      }
    }
  }

  return count;
}




    </script>

    <script>
        function capitalize(s) {
  let evenCaps = '';
  let oddCaps = '';

  for (let i = 0; i < s.length; i++) {
    if (i % 2 === 0) {
      evenCaps += s[i].toUpperCase();
      oddCaps += s[i];
    } else {
      evenCaps += s[i];
      oddCaps += s[i].toUpperCase();
    }
  }

  return [evenCaps, oddCaps];
}
    </script>
