<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href=",.css">
</head>
<body>

<div class="top-box">
    <div class="title">
        ROCK <br>
        PAPER <br>
        SCISSORS
    </div>

    <div class="score-box">
        <div class="score-title">Score</div>
        <div id="score">0</div>
    </div>
</div>

<div class="choices">
    <div class="choice rock" data-choice="rock">
        <img src="https://cdn.discordapp.com/attachments/1337145536834306048/1443287215999418510/image.png?ex=6980d9f7&is=697f8877&hm=3a9a37ee874f12267a30f4b397d9d301d2d797fb2dcd20588ff798bc9a9f841f&">
    </div>

    <div class="choice scissors" data-choice="scissors">
        <img src="https://cdn.discordapp.com/attachments/1337145536834306048/1443287227735081112/image.png?ex=6980d9fa&is=697f887a&hm=5122e3293027ba6081ec9f29915f0a2d5a1aa57056e991c133d3e6ab7bbddb0a&">
    </div>

    <div class="choice paper" data-choice="paper">
        <img src="https://cdn.discordapp.com/attachments/1337145536834306048/1443287262803529860/image.png?ex=6980da02&is=697f8882&hm=29fa8245ca9a62d93dbbb835b46a1afcf345437b80816aa73d5299fe7e26e8e0&">
    </div>
</div>

<script src="h.js"></script>
</body>
</html>
